# Reflector configuration, used by reflector.service / reflector.timer.
# The laptop has no working IPv6 route, so --ipv4 avoids dead mirrors.
--save /etc/pacman.d/mirrorlist
--country GB
--protocol https
--latest 20
--sort score
--completion-percent 100
--ipv4
--threads 5
--connection-timeout 5
--download-timeout 5
