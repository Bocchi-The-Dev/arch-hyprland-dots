# iwd is only the WiFi backend here; NetworkManager owns addressing and DNS.
# That is why EnableNetworkConfiguration stays off.
[General]
EnableNetworkConfiguration=false

# Stay on the gateway BSS. The second eero's 5 GHz backhaul is too weak
# (-80..-86), so it falls back to 2.4 GHz and steals airtime. Only roam
# when the current BSS is nearly unusable.
RoamThreshold=-85
RoamThreshold5G=-85
CriticalRoamThreshold=-85
CriticalRoamThreshold5G=-85

# Per-network random MAC, stable across reconnects (same idea as
# "cloned-mac-address=stable"). NetworkManager's own cloned-mac setting is
# ignored by its iwd backend, so this is the setting that actually takes
# effect on this machine.
AddressRandomization=network

# iwd ranks 5 GHz above 2.4 GHz by default. Zero disables 5 GHz scans and
# connections, keeping the laptop on the gateway's strong 2.4 GHz BSS.
[Rank]
BandModifier5GHz=0.0
