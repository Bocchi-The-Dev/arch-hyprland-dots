# Custom tuning for ASUS VivoBook E210MA (Celeron N4020)
# This file is symlinked into /etc/tlp.d/00-custom.conf and is the live config
# (see ~/dotfiles/README). TLP merges /etc/tlp.conf then /etc/tlp.d/*.conf,
# last setting wins. No hardware platform_profile here and intel_pstate is
# passive (intel_cpufreq), so governor + freq caps are what actually matter.

# Governor. intel_pstate is passive here, so TLP's values are the *generic*
# cpufreq governors. schedutil idles at min and ramps to turbo under load.
# DO NOT use "powersave" here: in active/HWP mode it scales, but in passive
# mode the generic powersave governor pins the CPU to min (800 MHz) always --
# that silently capped us to 0.8 GHz on battery.
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=schedutil

# Cap turbo on battery to extend runtime (kHz); 1.8 GHz vs 2.8 GHz max
CPU_SCALING_MAX_FREQ_ON_BAT=1800000

# Allow full turbo on AC (kHz). This MUST be set explicitly: TLP only applies
# the caps it is given, so without an ON_AC value the ON_BAT cap above leaks
# into AC mode and pins the CPU at 1.8 GHz even with the performance governor.
CPU_SCALING_MAX_FREQ_ON_AC=2800000

# Battery charge limit. This BIOS only exposes the end threshold
# (charge stops at 80%; resumes automatically when it drops below).
STOP_CHARGE_THRESH_BAT0=80