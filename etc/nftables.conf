#!/usr/bin/nft -f
# Host firewall for the ASUS VivoBook E210MA (Arch + Hyprland).
# Tracked in ~/dotfiles; setup.sh symlinks this into /etc/nftables.conf.
#
# Policy: deny inbound, allow everything outbound, allow replies back in.
# The only inbound exceptions are the ones a normal client actually needs.

destroy table inet filter
table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop comment "drop invalid conntrack entries"
		ct state { established, related } accept comment "replies to outbound traffic"

		iif lo accept comment "loopback: resolved stub on 127.0.0.53, local sockets"

		# DHCP client. The reply arrives before conntrack sees an established
		# flow, so it needs an explicit hole.
		udp sport 67 udp dport 68 accept comment "DHCPv4 lease"

		# mDNS for Avahi (.local discovery: printers, casting, KDE Connect).
		udp dport 5353 accept comment "mDNS"

		# ICMP is needed for PMTU discovery; ICMPv6 for neighbour discovery.
		meta l4proto { icmp, icmpv6 } accept comment "ping and PMTU"

		# Anything else addressed to the host: polite, rate-limited reject.
		pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
		counter comment "silently dropped"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
