# WiFi defaults, tracked in ~/dotfiles (setup.sh symlinks this into /etc).
[device]
# Randomise the MAC used for background scans.
wifi.scan-rand-mac-address=yes

[connection]
# Kept for completeness / if the backend ever switches back to wpa_supplicant.
# NOTE: NetworkManager's iwd backend ignores this. The setting that actually
# randomises the MAC on this machine is AddressRandomization=network in
# /etc/iwd/main.conf.
wifi.cloned-mac-address=stable
# 2 = disabled. With powersave on, the RTL8821CE parks the radio and the link
# collapses to MCS0 / 6.5 Mbit/s.
wifi.powersave=2
